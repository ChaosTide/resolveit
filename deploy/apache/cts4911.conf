# Apache 2.4 site configuration for the CTS 4911 ticket system.
# Included from Apache24\conf\httpd.conf by deploy\apache\install-apache.ps1.
# Apache runs as your Windows user (not a service) so PHP can reach SQL Server
# with Windows Authentication exactly as it does in SSMS.

Define CTS_PROJECT "C:/Users/draft/.codex/.chatgpt-projects/g-p-6a9a16814a50819193c4aa9f1683257a/ticket-system"
Define CTS_PHP "C:/Users/draft/AppData/Local/CodexTicketSystem/php83"

# Only this PC can reach the site. Change to "Listen 8080" to share it on your network.
Listen 127.0.0.1:8080

# PHP 8.3 (thread-safe build) as an Apache module.
LoadFile "${CTS_PHP}/php8ts.dll"
LoadModule php_module "${CTS_PHP}/php8apache2_4.dll"
PHPIniDir "${CTS_PROJECT}/runtime"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Hide version details.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost 127.0.0.1:8080>
    ServerName 127.0.0.1:8080
    # Only public/ is served; app/, database/, scripts/, and tests/ stay unreachable.
    DocumentRoot "${CTS_PROJECT}/public"
    <Directory "${CTS_PROJECT}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    # Block dotfiles such as .user.ini.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Visitors reach this server over HTTPS through the Cloudflare tunnel (deploy\tunnel), which
    # connects to 127.0.0.1 over plain HTTP. Tell PHP the original request was HTTPS so the
    # session cookie is marked Secure. Only local processes can reach this port, so the header is trusted.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Production PHP settings (mod_php ignores public/.user.ini, so they live here).
    php_admin_flag display_errors off
    php_admin_flag log_errors on
    php_admin_value error_log "${SRVROOT}/logs/php_errors.log"
    php_admin_flag session.use_strict_mode on
    php_admin_flag session.cookie_httponly on
    php_admin_flag expose_php off

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'"
    # Harmless over plain local HTTP (browsers only honor this header on an HTTPS response) and
    # matches the Docker config's value; protects the Cloudflare-tunnel HTTPS path from downgrade.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog "logs/cts4911_error.log"
    CustomLog "logs/cts4911_access.log" common
</VirtualHost>
